<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Dashboard | Hedonics Game</title>
    <link rel="stylesheet" href="/games/hedonics-online/app.css" />
  </head>
  <body>
    <main>
      <section class="card">
        <div class="row" style="justify-content: space-between">
          <h1>Admin Dashboard</h1>
          <a href="/games/hedonics-online/index.html">Home</a>
        </div>
        <p>Instructor controls for session setup, round transitions, and submission monitoring.</p>
      </section>

      <section id="login-card" class="card">
        <h2>Admin Login</h2>
        <div class="grid">
          <div>
            <label for="admin-email">Email</label>
            <input id="admin-email" type="email" autocomplete="username" />
          </div>
          <div>
            <label for="admin-password">Password</label>
            <input id="admin-password" type="password" autocomplete="current-password" />
          </div>
        </div>
        <div class="row" style="margin-top: 0.6rem">
          <button id="login-btn" class="primary" type="button">Log In</button>
          <button id="logout-btn" class="secondary" type="button">Log Out</button>
        </div>
        <div id="login-status" class="status hidden"></div>
      </section>

      <section id="admin-panel" class="hidden">
        <section class="card">
          <h2>Create / Reset Session</h2>
          <div class="grid">
            <div>
              <label for="session-name">Session Name</label>
              <input id="session-name" type="text" value="AEM 4510 Hedonics Session" />
            </div>
            <div>
              <label for="expected-team-count">Expected Team Count (1-6)</label>
              <input id="expected-team-count" type="number" min="1" max="6" value="6" />
            </div>
            <div>
              <label for="scoring-rank-points">Correct-Order Points (1st,2nd,3rd,...)</label>
              <input id="scoring-rank-points" type="text" value="10,7,5,3,1" />
            </div>
            <div>
              <label for="wrong-answer-deduction">Wrong-Answer Deduction (per incorrect submission)</label>
              <input id="wrong-answer-deduction" type="number" min="0" step="1" value="1" />
            </div>
          </div>
          <div class="row" style="margin-top: 0.6rem">
            <button id="create-session-btn" class="primary" type="button">Create New Active Session</button>
          </div>
          <div id="session-status" class="status hidden"></div>
        </section>

        <section class="card">
          <h2>Phase Controls</h2>
          <div class="grid">
            <div>
              <label for="set-phase">Phase</label>
              <select id="set-phase">
                <option value="setup">Setup</option>
                <option value="round1">Round 1</option>
                <option value="round2">Round 2</option>
                <option value="round3">Round 3</option>
                <option value="round4a">Round 4a</option>
                <option value="round4b">Round 4b</option>
                <option value="round5">Round 5</option>
                <option value="complete">Complete</option>
              </select>
            </div>
          </div>
          <div class="row" style="margin-top: 0.6rem">
            <button id="apply-phase-btn" class="primary" type="button">Apply Phase Update</button>
            <button id="refresh-admin-btn" class="secondary" type="button">Refresh Dashboard</button>
            <button id="export-csv-btn" class="secondary" type="button">Download CSV Snapshot</button>
          </div>
          <div id="phase-status" class="status hidden"></div>
        </section>

        <section class="card">
          <h2>Live Session Summary</h2>
          <dl class="kv" id="session-kv"></dl>
        </section>

        <section class="card">
          <h2>Current Round Context</h2>
          <div id="round-context" class="table-wrap"></div>
        </section>

        <section class="card">
          <h2>Reveal Status</h2>
          <div id="reveal-status" class="table-wrap"></div>
        </section>

        <section class="card">
          <h2>Point Leaderboard</h2>
          <div id="leaderboard-table" class="table-wrap"></div>
        </section>

        <section class="card">
          <h2 id="phase-team-title">Current Phase Team Detail</h2>
          <div id="phase-team-table" class="table-wrap"></div>
        </section>

        <section class="card">
          <h2>Teams</h2>
          <div id="teams-table" class="table-wrap"></div>
        </section>

        <section class="card">
          <h2>Round Submissions</h2>
          <div id="submissions-table" class="table-wrap"></div>
        </section>
      </section>
    </main>

    <script type="module" src="/games/hedonics-online/admin.mjs"></script>
  </body>
</html>
