<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Portal | Coase Game</title>
    <link rel="stylesheet" href="/games/coase-online/app.css" />
  </head>
  <body>
    <main>
      <section class="card">
        <div class="row" style="justify-content: space-between">
          <h1>Student Portal</h1>
          <a href="/games/coase-online/index.html">Home</a>
        </div>
        <p>Enter your player name to join and submit Coase round agreements with your matched partner.</p>
      </section>

      <section id="join-card" class="card">
        <h2>Join Player</h2>
        <div class="grid">
          <div>
            <label for="player-name">Player Name</label>
            <input id="player-name" type="text" autocomplete="off" placeholder="e.g., Alex" />
          </div>
          <div class="row" style="align-items: end">
            <button id="join-btn" class="primary" type="button">Join / Rejoin</button>
            <button id="reset-token-btn" class="secondary" type="button">Forget Join Token</button>
          </div>
        </div>
        <div id="join-status" class="status hidden"></div>
      </section>

      <section id="player-card" class="card hidden">
        <h2>Player Assignment</h2>
        <dl class="kv" id="player-kv"></dl>
      </section>

      <section id="stage-card" class="card hidden">
        <h2>Current Stage</h2>
        <p>Phase: <span id="phase-label" class="phase">-</span></p>
        <div id="round-context" class="table-wrap"></div>
        <div id="stage-status" class="status hidden"></div>
        <div id="stage-form-container"></div>
      </section>

      <section id="current-outcome-card" class="card hidden">
        <h2>Current Round Outcome</h2>
        <div id="current-outcome-table" class="table-wrap"></div>
      </section>

      <section id="history-card" class="card hidden">
        <h2>Round History</h2>
        <div id="history-table" class="table-wrap"></div>
      </section>
    </main>

    <script type="module" src="/games/coase-online/student.mjs"></script>
  </body>
</html>
