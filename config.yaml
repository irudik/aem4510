theme: starter-academic
title: AEM 4510
font: lato
baseurl: ''
copyright: ''
enableGitInfo: false
defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles:
  - \.ipynb$
  - .ipynb_checkpoints$
  - \.Rmd$
  - \.Rmarkdown$
  - _cache$
permalinks:
  authors: /author/:slug/
  categories: /category/:slug/
  event: /talk/:slug/
  publication_types: /publication-type/:slug/
  tags: /tag/:slug/
outputs:
  home:
    - HTML 
    - RSS
    - JSON
    - WebAppManifest
  section: 
    - HTML
    - RSS
mediaTypes:
  application/manifest+json:
    suffixes: webmanifest
outputFormats:
  WebAppManifest:
    mediaType: application/manifest+json
    rel: manifest
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: false
  tableOfContents:
    endLevel: 3
    startLevel: 2
imaging:
  anchor: smart
  quality: 75
  resampleFilter: lanczos
taxonomies:
  author: authors
  category: categories
  publication_type: publication_types
  tag: tags
related:
  includeNewer: true
  indices:
    - name: title
      weight: 60
    - name: summary
      weight: 50
    - name: tags
      weight: 80
    - name: categories
      weight: 70
    - name: authors
      weight: 20
  threshold: 80
  toLower: true
module:
  imports:
    - path: github.com/wowchemy/wowchemy-hugo-modules/wowchemy
  replacements:
    - github.com/wowchemy/wowchemy-hugo-modules/wowchemy -> themes/github.com/wowchemy/wowchemy-hugo-modules/wowchemy
    - github.com/wowchemy/wowchemy-hugo-modules/netlify-cms-academic -> themes/github.com/wowchemy/wowchemy-hugo-modules/netlify-cms-academic
